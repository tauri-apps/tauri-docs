# Netlify configuration for the releases site.
# Site settings: Base directory = packages/releases-site (this file is then picked up).
[build.environment]
  # The generator runs TypeScript natively via Node's type stripping
  NODE_VERSION = "24"

[build]
  command = "pnpm run build"
  publish = "dist"
  # Only build when the releases site itself (or the shared UI it imports from
  # the docs site — see README "Shared UI") changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../src/styles/theme.scss ../../src/styles/overrides.scss ../../src/styles/shared.scss ../../src/components/overrides ../../src/data/header-links.json ../../src/assets"
