[context.deploy-preview.environment]
TAURI_DOCS_SKIP_IMAGE_OPT = "true"

[build]
# Netlify clones shallow; Lunaria needs full git history to see files added in PRs
command = "git fetch --unshallow origin && pnpm build"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/:locale/v1/*"
to = "https://v1.tauri.app/:locale/v1/:splat"

[[redirects]]
from = "/v1/*"
to = "https://v1.tauri.app/v1/:splat"

# More redirects in /public/_redirects and astro.config.mjs
