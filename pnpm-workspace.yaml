packages:
  - packages/config-generator
  - packages/cli-generator
  - packages/releases-site
  - packages/compatibility-table
  - packages/fetch-sponsors
  - packages/tauri-typedoc
# Single source for versions that must stay aligned between the docs site
# (repo root) and packages/releases-site — the releases site imports docs-site
# components, which only works when pnpm dedupes both to one instance.
catalog:
  '@astrojs/starlight': 0.41.3
  astro: ^7.0.9
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
# Workspace-wide: lets any workspace package satisfy its peer deps from the root's
# dependencies. Needed so starlight-typedoc (a dep of packages/tauri-typedoc) resolves
# its @astrojs/starlight peer to the root's single instance instead of duplicating it —
# the same one-instance requirement the catalog above enforces for releases-site.
resolvePeersFromWorkspaceRoot: true
