packages:
  - packages/js-api-generator
  - packages/config-generator
  - packages/cli-generator
  - packages/releases-site
  - packages/compatibility-table
  - packages/fetch-sponsors
# Exact pins for the two packages that must not move on their own: a range here
# lets Renovate update the lockfile without the manifest, which breaks every PR's
# `pnpm i --frozen-lockfile` with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
catalog:
  '@astrojs/starlight': 0.41.5
  astro: 7.1.5
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
