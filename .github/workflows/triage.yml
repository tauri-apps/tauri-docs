name: 'Triage'

# Consolidates the former assign.yml, labeler.yml, priority.yml and status.yml
# into a single job so each issue/PR event occupies one runner slot, not four.
# SECURITY: runs on pull_request_target — never add a checkout of PR code here.

on:
  issues:
  pull_request_target:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: triage-${{ github.event.pull_request.number || github.event.issue.number }}
  # Queue, don't cancel: opened-event side effects must not be dropped.
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      #===== LABELER (formerly labeler.yml — all PR events) =====#
      - id: label-pr
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@v4
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'

      # Trigger prod netlify re-build to refresh i18n dashboard
      - name: Rebuild i18n Dashboard
        if: github.event_name == 'pull_request_target' && contains(steps.label-pr.outputs.all-labels, 'i18n')
        env:
          NETLIFY_BUILD_KEY: ${{ secrets.NETLIFY_BUILD_KEY }}
        run: curl -X POST -d {} https://api.netlify.com/build_hooks/$NETLIFY_BUILD_KEY

      #===== AUTO-ASSIGN (formerly assign.yml — PR opened only) =====#
      - name: Auto-assign PR to author
        if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'opened' && github.event.pull_request.user.type != 'Bot' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The gh cli currently does not consider the pr author an assignable user if they aren't part of the org
        run: gh api -X POST /repos/tauri-apps/tauri-docs/issues/${{ github.event.pull_request.number }}/assignees -f "assignees[]=${{ github.event.pull_request.user.login }}"

      - name: Auto-assign Renovate PRs
        if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'opened' && github.event.pull_request.user.login == 'renovate[bot]' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST /repos/tauri-apps/tauri-docs/issues/${{ github.event.pull_request.number }}/assignees -f "assignees[]=vasfvitor"

      #===== PROJECT BOARD (formerly priority.yml + status.yml) =====#
      # Items labeled 'manual' keep the guard those two workflows had; when it
      # applies, ITEM_ID stays empty and every later step is skipped.
      - name: Get project data
        if: ${{ !contains(github.event.issue.labels.*.name, 'manual') && !contains(github.event.pull_request.labels.*.name, 'manual') }}
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: |
          echo "PROJECT_ID=$(gh project view 27 --owner tauri-apps --format json --jq '.id')" >> $GITHUB_ENV
          gh project field-list 27 --owner tauri-apps --format json > project_data.json
          echo 'STATUS_FIELD_ID='$(jq '.fields[] | select(.name== "Status") | .id' project_data.json) >> $GITHUB_ENV
          echo 'BACKLOG_STATUS_ID='$(jq '.fields[] | select(.name== "Status") | .options[] | select(.name=="🪵 Backlog") | .id' project_data.json) >> $GITHUB_ENV
          echo 'READY_STATUS_ID='$(jq '.fields[] | select(.name== "Status") | .options[] | select(.name=="💪 Ready") | .id' project_data.json) >> $GITHUB_ENV
          echo 'IN_PROGRESS_STATUS_ID='$(jq '.fields[] | select(.name== "Status") | .options[] | select(.name=="🏗️ In progress") | .id' project_data.json) >> $GITHUB_ENV
          echo 'IN_REVIEW_STATUS_ID='$(jq '.fields[] | select(.name== "Status") | .options[] | select(.name=="📋 In review") | .id' project_data.json) >> $GITHUB_ENV
          echo 'DONE_STATUS_ID='$(jq '.fields[] | select(.name== "Status") | .options[] | select(.name=="✅ Done") | .id' project_data.json) >> $GITHUB_ENV
          echo 'PRIORITY_FIELD_ID='$(jq '.fields[] | select(.name== "Priority") | .id' project_data.json) >> $GITHUB_ENV
          echo 'LOW_PRIORITY_ID='$(jq '.fields[] | select(.name== "Priority") | .options[] | select(.name=="Low") | .id' project_data.json) >> $GITHUB_ENV

      - name: Add project item / Get item id
        if: ${{ !contains(github.event.issue.labels.*.name, 'manual') && !contains(github.event.pull_request.labels.*.name, 'manual') }}
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: echo "ITEM_ID=$(gh project item-add 27 --owner tauri-apps --url https://github.com/tauri-apps/tauri-docs/issues/${{ github.event.pull_request.number || github.event.issue.number }} --format json --jq '.id')" >> $GITHUB_ENV

      #===== PULL REQUESTS =====#
      - name: Is In progress
        if: ${{ env.ITEM_ID != '' && github.event_name == 'pull_request_target' && (github.event.pull_request.draft == true || github.event.pull_request.mergeable == false) }}
        run: echo 'STATUS_ID='${{ env.IN_PROGRESS_STATUS_ID }} >> $GITHUB_ENV

      - name: Is In review
        if: ${{ env.ITEM_ID != '' && github.event_name == 'pull_request_target' && github.event.pull_request.draft == false && github.event.pull_request.mergeable == true }}
        run: echo 'STATUS_ID='${{ env.IN_REVIEW_STATUS_ID }} >> $GITHUB_ENV
      #===== END PULL REQUESTS =====#

      #===== ISSUES =====#
      - name: Is Ready
        if: ${{ env.ITEM_ID != '' && github.event_name == 'issues' && (github.event.issue.labels[0] != null && github.event.issue.milestone != null) }}
        run: echo 'STATUS_ID='${{ env.READY_STATUS_ID }} >> $GITHUB_ENV

      - name: Is In progress (issue)
        if: ${{ env.ITEM_ID != '' && github.event_name == 'issues' && (github.event.issue.labels[0] != null && github.event.issue.milestone != null && github.event.issue.assignees[0] != null) }}
        run: echo 'STATUS_ID='${{ env.IN_PROGRESS_STATUS_ID }} >> $GITHUB_ENV

      - name: Is In review (issue)
        if: ${{ env.ITEM_ID != '' && github.event_name == 'issues' && (github.event.issue.labels[0] != null && github.event.issue.pull_request.merged_at != null) }}
        run: echo 'STATUS_ID='${{ env.IN_REVIEW_STATUS_ID }} >> $GITHUB_ENV

      - name: Is Backlog
        if: ${{ env.ITEM_ID != '' && github.event_name == 'issues' && (github.event.issue.labels[0] == null || github.event.issue.milestone == null || contains(github.event.issue.labels.*.name, 'upstream') || contains(github.event.issue.labels.*.name, 'discuss')) }}
        run: echo 'STATUS_ID='${{ env.BACKLOG_STATUS_ID }} >> $GITHUB_ENV
      #===== END ISSUES =====#

      - name: Set status field
        if: ${{ github.event.issue.state == 'open' || github.event.pull_request.state == 'open' }}
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: gh project item-edit --id ${{ env.ITEM_ID }} --project-id ${{ env.PROJECT_ID }} --field-id ${{ env.STATUS_FIELD_ID }} --single-select-option-id ${{ env.STATUS_ID }}

      - name: Set priority field
        if: ${{ github.event.action == 'opened' && (github.event.issue.state == 'open' || github.event.pull_request.state == 'open') }}
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
        run: gh project item-edit --id ${{ env.ITEM_ID }} --project-id ${{ env.PROJECT_ID }} --field-id ${{ env.PRIORITY_FIELD_ID }} --single-select-option-id ${{ env.LOW_PRIORITY_ID }}
